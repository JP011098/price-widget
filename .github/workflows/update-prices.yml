name: Update prices

on:
  schedule:
    # NOTE: GitHub's cron scheduler has been unreliable for this repo (and is
    # documented as "best-effort" generally) -- the Scriptable widget itself
    # now also triggers this workflow via the GitHub API on every refresh, as
    # a more dependable primary path. This cron entry is left in as a free
    # backup in case GitHub's scheduler starts behaving.
    - cron: "0 * * * *"
  workflow_dispatch: {}  # lets you trigger it manually, or via the widget's API call

concurrency:
  group: update-prices
  cancel-in-progress: false  # queue runs instead of overlapping, to avoid git push races

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch latest prices
        env:
          GOLDAPI_KEY: ${{ secrets.GOLDAPI_KEY }}
          GOOGLE_MAPS_KEY: ${{ secrets.GOOGLE_MAPS_KEY }}
        run: python scripts/fetch_prices.py

      - name: Commit updated data
        run: |
          git config user.name "price-bot"
          git config user.email "price-bot@users.noreply.github.com"
          # This file is fully regenerated every run, so there's nothing to
          # meaningfully "merge" between old and new content -- whichever run
          # finishes should just place its fresh data on top of the current
          # tip. Resetting onto the latest remote commit each attempt (rather
          # than rebasing/merging file content) avoids conflicts entirely; the
          # retry loop is just a safety net for the rare case two runs race
          # on the final push despite the concurrency group above.
          for i in 1 2 3 4 5; do
            git fetch origin main
            git reset --soft origin/main
            git add data/prices.json
            if git diff --staged --quiet; then
              echo "No changes to commit."
              exit 0
            fi
            git commit -m "Update prices"
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "Push failed (race with another run), retrying..."
            sleep 3
          done
          echo "Failed to push after retries" >&2
          exit 1
