name: Update prices

on:
  schedule:
    # Every hour, on the hour. Cron is UTC. The workflow itself runs hourly,
    # but fetch_prices.py only actually calls GoldAPI (CAD metals) every 12
    # hours (see cad_refresh_every_hours in config/products.json) to stay
    # well within its 100 requests/month free tier. INR (scraped) and gas
    # refresh every run since those sources don't have tight quotas.
    - cron: "0 * * * *"
  workflow_dispatch: {}  # lets you trigger it manually from the Actions tab

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch latest prices
        env:
          GOLDAPI_KEY: ${{ secrets.GOLDAPI_KEY }}
          GOOGLE_MAPS_KEY: ${{ secrets.GOOGLE_MAPS_KEY }}
        run: python scripts/fetch_prices.py

      - name: Commit updated data
        run: |
          git config user.name "price-bot"
          git config user.email "price-bot@users.noreply.github.com"
          git add data/prices.json
          git diff --staged --quiet || git commit -m "Update prices"
          git push
