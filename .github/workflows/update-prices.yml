name: Update prices

on:
  schedule:
    # NOTE: GitHub's cron scheduler has been unreliable for this repo (and is
    # documented as "best-effort" generally) -- the Scriptable widget itself
    # now also triggers this workflow via the GitHub API on every refresh, as
    # a more dependable primary path. This cron entry is left in as a free
    # backup in case GitHub's scheduler starts behaving.
    - cron: "0 * * * *"
  workflow_dispatch: {}  # lets you trigger it manually, or via the widget's API call

concurrency:
  group: update-prices
  cancel-in-progress: false  # queue runs instead of overlapping, to avoid git push races

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch latest prices
        env:
          GOLDAPI_KEY: ${{ secrets.GOLDAPI_KEY }}
          GOOGLE_MAPS_KEY: ${{ secrets.GOOGLE_MAPS_KEY }}
        run: python scripts/fetch_prices.py

      - name: Commit updated data
        run: |
          git config user.name "price-bot"
          git config user.email "price-bot@users.noreply.github.com"
          git add data/prices.json
          git diff --staged --quiet || git commit -m "Update prices"
          git pull --rebase
          git push
